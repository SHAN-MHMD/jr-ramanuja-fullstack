<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Jr. Ramanuja</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Fredoka',sans-serif;
}

body{
min-height:100vh;
background:#fff7ed;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
position:relative;
overflow:hidden;
}

body::before{
content:'';
position:absolute;
width:300px;
height:300px;
background:#fde68a;
border-radius:50%;
top:-100px;
left:-100px;
z-index:-1;
}

body::after{
content:'';
position:absolute;
width:350px;
height:350px;
background:#bfdbfe;
border-radius:50%;
bottom:-120px;
right:-120px;
z-index:-1;
}

.login-card{
width:100%;
max-width:500px;
background:white;
padding:40px;
border-radius:40px;
box-shadow:0 15px 40px rgba(0,0,0,0.08);
text-align:center;
}

.logo-box{
width:150px;
height:150px;
margin:auto;
background:#f8fafc;
border-radius:30px;
border:5px dashed #cbd5e1;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.logo-box img{
width:100%;
height:100%;
object-fit:cover;
}

h1{
margin-top:20px;
font-size:42px;
color:#1e293b;
}

p{
margin-top:10px;
color:#64748b;
font-size:18px;
}

.input-group{
margin-top:25px;
text-align:left;
}

.input-group label{
display:block;
margin-bottom:8px;
font-size:18px;
font-weight:600;
color:#334155;
}

.input-group input{
width:100%;
padding:18px;
border:none;
border-radius:20px;
background:#f1f5f9;
font-size:16px;
outline:none;
}

.login-btn{
width:100%;
margin-top:30px;
padding:18px;
border:none;
border-radius:25px;
background:#f97316;
color:white;
font-size:20px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.error-message{
    margin-top:15px;
    margin-bottom:15px;
    padding:12px;
    background:#fee2e2;
    color:#dc2626;
    border-radius:15px;
    font-weight:600;
    text-align:center;
}

.login-btn:hover{
transform:scale(1.03);
}

.register-link{
margin-top:20px;
font-size:17px;
color:#64748b;
}

.register-link a{
text-decoration:none;
color:#f97316;
font-weight:600;
}

.home-link{
display:inline-block;
margin-top:20px;
text-decoration:none;
color:#3b82f6;
font-size:16px;
font-weight:600;
}

@media(max-width:600px){

.login-card{
padding:30px;
}

h1{
font-size:34px;
}

.logo-box{
width:120px;
height:120px;
}

}

</style>
</head>
<body>

<div class="login-card">

<div class="logo-box">
<img src="{{ url_for('static', filename='logo.png') }}" alt="logo">
</div>

<h1>Welcome Back! 🎓</h1>

<p>
Continue your maths journey and become a Junior Ramanujan.
</p>

<form method="POST">

<div class="input-group">
<label>Username</label>
<input type="text" name="username" placeholder="Enter username" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" name="password" placeholder="Enter password" required>
</div>

{% if error %}
<div class="error-message">
    {{ error }}
</div>
{% endif %}

<button type="submit" class="login-btn">
    Login 🚀
</button>

</form>

<div class="register-link">
Don't have an account?
<a href="{{ url_for('register') }}">Register</a>
</div>

<a href="{{ url_for('home') }}" class="home-link">
← Back to Home
</a>

</div>

</body>
</html>
