<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Jr. Ramanuja</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Fredoka',sans-serif;
}

body{
min-height:100vh;
background:#fff7ed;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
position:relative;
overflow-x:hidden;
overflow-y:auto;
}

body::before{
content:'';
position:absolute;
width:300px;
height:300px;
background:#fde68a;
border-radius:50%;
top:-100px;
left:-100px;
z-index:-1;
}

body::after{
content:'';
position:absolute;
width:350px;
height:350px;
background:#bfdbfe;
border-radius:50%;
bottom:-120px;
right:-120px;
z-index:-1;
}

.register-card{
width:100%;
max-width:550px;
background:white;
padding:40px;
border-radius:40px;
box-shadow:0 15px 40px rgba(0,0,0,0.08);
text-align:center;
}

.logo-box{
width:150px;
height:150px;
margin:auto;
background:#f8fafc;
border-radius:30px;
border:5px dashed #cbd5e1;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.logo-box img{
width:100%;
height:100%;
object-fit:cover;
}

h1{
margin-top:20px;
font-size:42px;
color:#1e293b;
}

.subtitle{
margin-top:10px;
color:#64748b;
font-size:18px;
}

.input-group{
margin-top:20px;
text-align:left;
}

.input-group label{
display:block;
margin-bottom:8px;
font-size:18px;
font-weight:600;
color:#334155;
}

.input-group input{
width:100%;
padding:18px;
border:none;
border-radius:20px;
background:#f1f5f9;
font-size:16px;
outline:none;
}

.error-message{margin-top:15px;padding:12px;background:#fee2e2;color:#dc2626;border-radius:15px;font-weight:600;}

.register-btn{
width:100%;
margin-top:30px;
padding:18px;
border:none;
border-radius:25px;
background:#22c55e;
color:white;
font-size:20px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.register-btn:hover{
transform:scale(1.03);
}

.login-link{
margin-top:20px;
font-size:17px;
color:#64748b;
}

.login-link a{
text-decoration:none;
color:#f97316;
font-weight:600;
}

.home-link{
display:inline-block;
margin-top:20px;
text-decoration:none;
color:#3b82f6;
font-size:16px;
font-weight:600;
}

@media(max-width:600px){

.register-card{
padding:30px;
}

h1{
font-size:34px;
}

.logo-box{
width:120px;
height:120px;
}

}

</style>
</head>
<body>

<div class="register-card">

<div class="logo-box">
<img src="{{ url_for('static', filename='logo.png') }}" alt="logo">
</div>

<h1>Create Account 🎓</h1>

<p class="subtitle">
Join Jr. Ramanuja and start your maths adventure today!
</p>

<form method="POST">

{% if error %}
<div class="error-message">{{ error }}</div>
{% endif %}

<div class="input-group">
<label>Full Name</label>
<input type="text" name="name" placeholder="Enter your name" required>
</div>

<div class="input-group">
<label>Age</label>
<input type="number" name="age" placeholder="Enter your age" required>
</div>

<div class="input-group">
<label>Username</label>
<input type="text" name="username" placeholder="Choose a username" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" name="password" placeholder="Create a password" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" name="confirm_password" placeholder="Confirm password" required>
</div>

<button class="register-btn">
Create Account 🚀
</button>

</form>

<div class="login-link">
Already have an account?
<a href="{{ url_for('login') }}" class="hero-btn">Login</a>
</div>

<a href="{{ url_for('home') }}" class="home-link">
← Back to Home
</a>

</div>

<script>
const inputs = document.querySelectorAll("input");

inputs.forEach((input, index) => {
    input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();

            if (index < inputs.length - 1) {
                inputs[index + 1].focus();
            } else {
                document.querySelector("form").submit();
            }
        }
    });
});
</script>

</body>
</html>
